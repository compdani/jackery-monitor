# Native Go/PocketBase HTTP server (legacy config import still required).
# Build: docker compose -f docker-compose.yml up -d --build
# API coverage and rollback instructions: MIGRATION.md

services:
  # Native Go dashboard on Raspberry Pi (64-bit Linux).
  jackery-monitor:
    build:
      context: .
      target: go-runtime
    image: jackery-monitor-go:local
    pull_policy: never
    container_name: jackery-monitor
    restart: unless-stopped
    command: ["serve", "--http=0.0.0.0:${JACKERY_HTTP_PORT:-8123}", "--dir=/data/pb_data"]
    # Host networking and D-Bus expose the host BlueZ adapter.
    network_mode: host
    environment:
      BACKEND: native
      JACKERY_MQTT_INSECURE_TLS: "${JACKERY_MQTT_INSECURE_TLS:-false}"
      JACKERY_MQTT_CA_FILE: "${JACKERY_MQTT_CA_FILE:-}"
      JACKERY_CF_ACCESS_TEAM: "${JACKERY_CF_ACCESS_TEAM:-}"
      JACKERY_CF_ACCESS_AUD: "${JACKERY_CF_ACCESS_AUD:-}"
      JACKERY_CF_ACCESS_EMAILS: "${JACKERY_CF_ACCESS_EMAILS:-}"
      JACKERY_MQTT_BROKER: "${JACKERY_MQTT_BROKER:-ssl://emqx.jackeryapp.com:8883}"
      # Preserve the legacy encryption key; config import is still required.
      JACKERY_AT_REST_KEY_FILE: /data/.jackery-creds.key
    volumes:
      - jackery-data:/data
      # Host BlueZ D-Bus so the Go adapter can use the Pi's Bluetooth adapter.
      # bluetoothd must be running on the Pi host; if a scan returns nothing,
      # check `bluetoothctl show` on the host and enter the BMS MAC manually.
      - /var/run/dbus:/var/run/dbus:ro

volumes:
  jackery-data:
