# Native Go/PocketBase HTTP server (legacy config import still required).
# Build: docker compose -f docker-compose.build.yml up -d --build
# API coverage and rollback instructions: MIGRATION.md

services:
  # Go/PocketBase dashboard — host networking so backup auto-discovery can
  # sweep the LAN directly. See docker-compose.yml for the full notes.
  jackery-monitor:
    build:
      context: .
      target: go-runtime
    image: jackery-monitor-go:local
    container_name: jackery-monitor
    restart: unless-stopped
    command: ["serve", "--http=0.0.0.0:${JACKERY_HTTP_PORT:-8123}", "--dir=/data/pb_data"]
    network_mode: host
    environment:
      BACKEND: native
      # Preserve the legacy encryption key; config import is still required.
      JACKERY_AT_REST_KEY_FILE: /data/.jackery-creds.key
    volumes:
      - jackery-data:/data
      # Host BlueZ D-Bus so bleak can talk to a USB BLE adapter on the NAS.
      # bluetoothd must be running on DSM; if scan returns nothing, enable
      # host Bluetooth for the dongle and enter the BMS MAC manually.
      - /var/run/dbus:/var/run/dbus:ro
      # Live-bind the web UI so editing files in /docker/jackery-monitor/web/
      # takes effect immediately (just hard-reload the browser, no rebuild).
      # Comment this out if you want the image to be self-contained.
      - ./web:/app/web
    # NET_ADMIN + NET_RAW: optional local Siseli ARP sniff. See docker-compose.yml.
    cap_add:
      - NET_ADMIN
      - NET_RAW

volumes:
  jackery-data:
